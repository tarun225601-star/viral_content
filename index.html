<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Content Marketplace - Pro Version</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; 
            --text: #f8fafc; --error: #ef4444; --success: #22c55e;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* Header */
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .gear-btn { background: #334155; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; color: var(--accent); font-size: 20px; }
        
        /* Modal System */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-content { background: var(--card); max-width: 600px; margin: 30px auto; padding: 30px; border-radius: 16px; border: 1px solid #475569; }
        
        /* Form Styling */
        input, select, textarea, button { width: 100%; padding: 14px; margin: 10px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        
        /* Marketplace */
        .container { max-width: 1000px; margin: 20px auto; padding: 10px; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        
        /* Status Bar */
        #statusBar { padding: 15px; margin: 10px 0; border-radius: 8px; font-size: 0.9rem; display: none; }
        .success-box { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--success); color: var(--success); }
        .error-box { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); }
    </style>
</head>
<body>

<header>
    <h1>Content Hub</h1>
    <button class="gear-btn" onclick="toggleModal()">⚙️ Settings</button>
</header>

<div class="container">
    <div id="marketFeed" class="market-grid">
        <p>मार्केटलोड हो रहा है...</p>
    </div>
</div>

<!-- Modal Structure -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0;">🔧 सिस्टम कॉन्फ़िगरेशन</h2>
        
        <!-- API Settings -->
        <input type="text" id="db_url" placeholder="Supabase Project URL">
        <input type="text" id="db_key" placeholder="Supabase Anon Key">
        <button onclick="saveConfig()" style="background:#64748b; color:white;">सेव करें (Permanent)</button>
        
        <hr style="border: 0; border-top: 1px solid #475569; margin: 20px 0;">
        
        <!-- Upload Form -->
        <h3>📤 वीडियो अपलोडर</h3>
        <input type="text" id="v_title" placeholder="वीडियो का नाम">
        <select id="v_reach">
            <option value="10K">10K+ Views</option>
            <option value="100K">100K+ Views</option>
            <option value="1M">1M+ Views</option>
        </select>
        <textarea id="v_desc" placeholder="डिस्क्रिप्शन"></textarea>
        <input type="file" id="v_file" accept="video/*">
        <button onclick="processUpload()">वीडियो लाइव करें</button>
        
        <div id="statusBar"></div>
        <button onclick="toggleModal()" style="background:transparent; color:#94a3b8; border:1px solid #475569;">बंद करें</button>
    </div>
</div>

<script>
    // --- APP LOGIC ---
    let client = null;
    const statusBox = document.getElementById('statusBar');

    window.onload = () => {
        // परमानेंट सेटिंग्स लोड करें
        const url = localStorage.getItem('my_url');
        const key = localStorage.getItem('my_key');
        if(url && key) {
            document.getElementById('db_url').value = url;
            document.getElementById('db_key').value = key;
            initSupabase(url, key);
        }
        loadMarket();
    };

    function initSupabase(u, k) {
        try {
            client = supabase.createClient(u, k);
        } catch(e) {
            showStatus("Error Initializing: " + e.message, 'error');
        }
    }

    function toggleModal() {
        const m = document.getElementById('settingsModal');
        m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    function showStatus(msg, type) {
        statusBox.style.display = 'block';
        statusBox.className = (type === 'error') ? 'error-box' : 'success-box';
        statusBox.innerText = msg;
    }

    function saveConfig() {
        const u = document.getElementById('db_url').value.trim();
        const k = document.getElementById('db_key').value.trim();
        if(!u.startsWith('https')) return showStatus("URL गलत है! https:// से शुरू करें", 'error');
        
        localStorage.setItem('my_url', u);
        localStorage.setItem('my_key', k);
        initSupabase(u, k);
        showStatus("✅ सेटिंग्स परमानेंट सेव हो गई!", 'success');
    }

    async function processUpload() {
        if(!client) return showStatus("पहले API Settings सेव करें!", 'error');
        
        const file = document.getElementById('v_file').files[0];
        const title = document.getElementById('v_title').value;
        if(!file || !title) return showStatus("फाइल और टाइटल जरूरी है!", 'error');

        showStatus("⏳ अपलोड हो रहा है...", 'success');

        try {
            // Storage
            const { data, error } = await client.storage
                .from('videos')
                .upload(Date.now() + '.mp4', file);
            
            if(error) throw error;

            // Database
            const { error: dbErr } = await client
                .from('contents')
                .insert([{ title, description: document.getElementById('v_desc').value, url: data.path }]);

            if(dbErr) throw dbErr;

            showStatus("🎉 वीडियो सफलतापूर्वक लाइव है!", 'success');
            loadMarket();
        } catch(e) {
            showStatus("❌ Failed to fetch/upload: " + e.message, 'error');
            console.error(e);
        }
    }

    async function loadMarket() {
        if(!client) return;
        const { data, error } = await client.from('contents').select('*');
        if(error) return console.log("डेटा लोड एरर");
        
        const feed = document.getElementById('marketFeed');
        feed.innerHTML = data.map(i => `
            <div class="video-card">
                <h3>${i.title}</h3>
                <p>${i.description}</p>
                <button>देखें / खरीदें</button>
            </div>
        `).join('');
    }
</script>

</body>
</html>
