<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Content Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --error: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
        .gear-icon { font-size: 28px; cursor: pointer; color: var(--accent); }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-content { background: var(--card); max-width: 500px; margin: 40px auto; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
        
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--card); border-radius: 10px; padding: 15px; border: 1px solid #334155; }
        .error { color: var(--error); font-size: 0.9rem; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 5px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="nav">
    <h1>Marketplace</h1>
    <span class="gear-icon" onclick="document.getElementById('modal').style.display='block'">⚙️</span>
</div>

<div id="marketFeed" class="market-grid"></div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <button style="background:transparent; color:white; text-align:right;" onclick="document.getElementById('modal').style.display='none'">[ बंद करें X ]</button>
        
        <h3>⚙️ कॉन्फ़िगरेशन</h3>
        <input type="text" id="url" placeholder="Supabase Project URL">
        <input type="text" id="key" placeholder="Supabase Anon Key">
        <button onclick="saveConfig()">सेव कॉन्फ़िगरेशन</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #334155;">

        <h3>📤 वीडियो अपलोड</h3>
        <input type="text" id="cTitle" placeholder="वीडियो टाइटल">
        <select id="cReach">
            <option value="10K">10K+ Views</option>
            <option value="1M">1M+ Views</option>
        </select>
        <textarea id="cDesc" placeholder="वीडियो डिस्क्रिप्शन"></textarea>
        <input type="file" id="videoFile" accept="video/*">
        <button onclick="uploadAction()">मार्केट पर डालें</button>
        
        <div id="errorBox" class="error"></div>
    </div>
</div>

<script>
    let supabaseClient;
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.innerText = msg;
    }

    function saveConfig() {
        const u = document.getElementById('url').value;
        const k = document.getElementById('key').value;
        if(!u || !k) return showError("URL और Key खाली है!");
        localStorage.setItem('db_url', u);
        localStorage.setItem('db_key', k);
        location.reload();
    }

    const savedUrl = localStorage.getItem('db_url');
    const savedKey = localStorage.getItem('db_key');
    if(savedUrl && savedKey) {
        supabaseClient = supabase.createClient(savedUrl, savedKey);
    }

    async function uploadAction() {
        if(!supabaseClient) return showError("पहले कॉन्फ़िगरेशन सेव करें!");
        
        const file = document.getElementById('videoFile').files[0];
        if(!file) return showError("वीडियो फाइल चुनें!");

        errorBox.style.display = 'block';
        errorBox.innerText = "अपलोड हो रहा है, रुकें...";

        try {
            // 1. Storage Upload
            const { data, error } = await supabaseClient.storage
                .from('videos')
                .upload(Date.now() + '.mp4', file);
            
            if(error) throw error;

            // 2. Database Insert
            const { error: dbErr } = await supabaseClient
                .from('contents')
                .insert([{ 
                    title: document.getElementById('cTitle').value,
                    description: document.getElementById('cDesc').value,
                    reach: document.getElementById('cReach').value,
                    url: data.path 
                }]);

            if(dbErr) throw dbErr;

            errorBox.innerText = "सफलतापूर्वक लाइव हो गया!";
        } catch(e) {
            showError("Error: " + e.message);
        }
    }
</script>

</body>
</html>
